<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Runtime architecture</title>
  <desc id="desc">A request flows through parser, task graph, isolated workers, and artifact storage.</desc>
  <rect width="1600" height="900" fill="#d9d1c3"/>
  <g fill="none" stroke="#57534c" stroke-width="3">
    <path d="M220 450h180m250 0h180m250 0h180"/>
    <path d="m380 436 20 14-20 14m430-28 20 14-20 14m430-28 20 14-20 14"/>
    <rect x="80" y="330" width="300" height="240" rx="4"/>
    <rect x="400" y="330" width="250" height="240" rx="4"/>
    <rect x="830" y="230" width="250" height="180" rx="4"/>
    <rect x="830" y="490" width="250" height="180" rx="4"/>
    <rect x="1240" y="330" width="280" height="240" rx="4"/>
    <path d="M650 450h90v-130h90m-90 130v130h90"/>
  </g>
  <g fill="#34312d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="110" y="375" font-size="22" letter-spacing="4">01 / REQUEST</text>
    <text x="110" y="470" font-size="42">Markdown</text>
    <text x="430" y="375" font-size="22" letter-spacing="4">02 / GRAPH</text>
    <text x="430" y="470" font-size="42">Scheduler</text>
    <text x="860" y="275" font-size="22" letter-spacing="4">03A / WORKER</text>
    <text x="860" y="350" font-size="34">Isolated A</text>
    <text x="860" y="535" font-size="22" letter-spacing="4">03B / WORKER</text>
    <text x="860" y="610" font-size="34">Isolated B</text>
    <text x="1270" y="375" font-size="22" letter-spacing="4">04 / OUTPUT</text>
    <text x="1270" y="470" font-size="42">Artifacts</text>
  </g>
</svg>
